<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinRAG Demo</title>
<meta name="description" content="FinRAG: citation-enforced answers from SEC filings. 37-second demo of the live app.">
<meta property="og:title" content="FinRAG Demo">
<meta property="og:description" content="Every answer has a source.">
<meta property="og:image" content="https://ac265640.github.io/FinRAG/demo/poster.jpg">
<meta property="og:video" content="https://ac265640.github.io/FinRAG/demo/finrag-demo.mp4">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f4f4f5; --muted:#a1a1aa; --red:#ef4335; --bg:#000; --line:rgba(255,255,255,.14) }
  * { box-sizing:border-box; margin:0 }
  body { background:radial-gradient(1000px 600px at 50% 110%, rgba(239,67,53,.18), transparent 65%), var(--bg);
         color:var(--ink); font-family:Inter,system-ui,sans-serif; min-height:100vh;
         display:flex; flex-direction:column; align-items:center; padding:40px 16px }
  header { text-align:center; margin-bottom:28px }
  h1 { font-weight:800; font-size:clamp(34px,5vw,54px); letter-spacing:-.04em }
  header p { color:var(--muted); margin-top:8px; font-size:18px }
  header p b { color:var(--red); font-weight:500 }
  .player { position:relative; width:min(1100px,100%); border-radius:18px; overflow:hidden; background:#000;
            box-shadow:0 0 0 1px var(--line), 0 30px 90px -30px rgba(239,67,53,.45) }
  video { display:block; width:100%; height:auto; aspect-ratio:16/9 }
  #sound { position:absolute; right:16px; bottom:64px; border:0; cursor:pointer; font:500 15px Inter,sans-serif;
           color:#fff; background:rgba(239,67,53,.92); padding:10px 16px; border-radius:999px }
  .links { margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center }
  .links a { color:var(--ink); text-decoration:none; font:500 15px 'IBM Plex Mono',monospace; padding:10px 18px; border-radius:999px;
             background:rgba(255,255,255,.06); box-shadow:0 0 0 1px var(--line) }
  .links a.primary { background:var(--red); color:#fff; box-shadow:none }
</style>
</head>
<body>
  <header>
    <h1>FinRAG</h1>
    <p>Citation-enforced answers from <b>SEC filings</b>.</p>
  </header>

  <div class="player">
    <video id="v" src="demo/finrag-demo.mp4" poster="demo/poster.jpg" controls autoplay muted playsinline preload="auto"></video>
    <button id="sound" type="button">🔊 Tap for sound</button>
  </div>

  <div class="links">
    <a class="primary" href="https://fin-rag-five.vercel.app">Try the live app</a>
    <a href="https://github.com/ac265640/FinRAG">View the code</a>
    <a href="demo/finrag-demo.mp4" download>Download MP4</a>
  </div>

<script>
  const v = document.getElementById('v'), b = document.getElementById('sound');
  const hide = () => { if (!v.muted) b.style.display = 'none'; };
  b.onclick = () => { v.muted = false; v.currentTime = 0; v.play(); hide(); };
  v.addEventListener('volumechange', hide);
</script>
</body>
</html>
